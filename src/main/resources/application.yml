spring:
  application:
    name: trendpilot
  config:
    # 本机私密配置（Telegram Token 等），不进代码仓库
    import: optional:file:${trendpilot.local-config:./config/application-local.yml}
  datasource:
    url: jdbc:sqlite:${trendpilot.data-dir:./data}/trendpilot.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite 单写者
      connection-timeout: 120000   # 多个定时任务排队用同一个连接
  flyway:
    enabled: true
    out-of-order: true   # 多个线程并行开发时迁移编号可能不按合并顺序到达
  task:
    scheduling:
      shutdown:
        await-termination: true          # 停机时等正在跑的 Discovery / Monitor 结束
        await-termination-period: 90s
  lifecycle:
    timeout-per-shutdown-phase: 90s
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080
  address: 127.0.0.1   # 只在本机可访问
  shutdown: graceful   # 自动更新停机时等正在处理的请求结束

trendpilot:
  zone: Asia/Ho_Chi_Minh
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  file:
    name: ./logs/trendpilot.log
  logback:
    rollingpolicy:
      max-history: 30

# 策略参数（人工修改后请同时修改 version）
trendpilot.strategy:
  version: v3-2026-10-15-review
  fee-rate: 0.001                 # 单边手续费 0.1%
  universe:
    quote-asset: USDT
    # 稳定币、法币、黄金代币等
    excluded-base-assets: [USDC, FDUSD, TUSD, USDP, DAI, BUSD, USDE, USD1, PYUSD, RLUSD, XUSD, BFUSD, AEUR, FRAX, USDS, EUR, EURI, GBP, TRY, BRL, ARS, JPY, MXN, PLN, RON, UAH, ZAR, PAXG, XAUT]
    # 官方代币化股票（Bybit xStocks、Binance 上的 GMEB/LLYB 等）；交易所标记为股票类、或 CoinGecko 分类为股票的也会排除
    tokenized-stock-base-assets: [GMEB, LLYB, AAPLX, AMZNX, COINX, CRCLX, GOOGLX, HOODX, METAX, MSFTX, MSTRX, NVDAX, QQQX, SPYX, TSLAX]
    blocklist: []                 # 人工确认身份有问题的标的
    max-missing-ratio: 0.05       # 缺数据超过 5% 视为扫描不完整，不做新买入
  early:
    min-hits: 2
    rel1h: 0.8
    rel4h: 1.5
    accel: 0.5
    volume-accel: 1.35
    compression: 1.2
    momentum-rel1h: 0.25
  review:
    min-score: 8
    min-rel1h: 0.8
    min-rel4h: 1.5
    max-signal-age-minutes: 30    # 信号取最近整点小时收盘，Discovery 在 :17 跑，正常 17 分钟
    max-spread-bps: 50
    depth-band-pct: 2
    min-depth-usdt: 30000
    max-slippage-bps: 75
    min-rr: 1.5
    chase-threshold-pct: 12       # 高于首次 EARLY 价 12% 以上
    chase-min-rr: 2
    hot24h-pct: 20                # 24 小时涨超 20%
    hot-rel1h-multiplier: 2       # 此时 1h 相对收益要求翻倍，且加速度必须为正
    risk-drop-pct: 2.5            # RR 风险情景假设跌幅（不是止损线）
    upside-atr-multiple: 4
    min-upside-pct: 2
    max-upside-pct: 15
    reentry-cooldown-minutes: 60
    reentry-min-early-observations: 2   # 卖出后至少 2 个独立 generation 重新出现 EARLY，才允许再买
  capital:
    hard-cap: 20000
    normal-pool: 17000
    strategic-reserve: 3000
    trade-size: 1000
    max-tranches-per-coin: 3
    regime-limits:
      - { regime: RISK_OFF, pct: 0.60 }
      - { regime: NEUTRAL, pct: 0.75 }
      - { regime: CONSTRUCTIVE, pct: 0.85 }
      - { regime: STRONG, pct: 0.95 }
  add:
    min-drop-pct: 1.5
    atr-multiple: 1.0
    third-tranche-multiplier: 1.5
    min-signal-gap-minutes: 15
  exit:
    protect-arm-pct: 2            # 原始收益 ≥2% 且净利 >0 启动利润保护
    protect-min-floor-pct: 0.35   # 底线至少为本金 0.35%
    protect-giveback-pct: 1       # 或 最高净利 − 本金 1%（2026-10-14 由 2 收紧）
    protect-lock-ratio: 0.6       # 或 最高净利的 60%（2026-10-14 新增）：三者取高
    review-target-pct: 8          # 原始收益 8% 时复核
    decay-min-weak: 2             # 至少两项弱条件
    decay-consecutive: 3          # 连续三个有效观察
    hard-max-spread-bps: 300      # 严重流动性异常
    hard-max-slippage-bps: 300
    hard-min-bid-depth-usdt: 5000
  risk:
    btc-shock1h-pct: -3           # BTC 1h 跌超 3% 视为市场冲击，本轮不新增风险
    risk-off-btc24h-pct: -5
    risk-off-btc4h-pct: -2.5
    risk-off-breadth: 0.25
    constructive-breadth: 0.5
    strong-breadth: 0.65
    strong-btc24h-pct: 3
    loss-exits-freeze: 3          # 窗口内亏损退出 ≥3 次：冻结新增
    loss-exits-half-budget: 2     # =2 次：额度减半
    loss-window-hours: 24
    liquidity-stress-spread-bps: 25   # 成交额前 50 的标的中位价差超过 25 bps 视为流动性紧张
    stable-depeg-pct: 0.5             # USDC 等稳定币偏离 1 美元超过 0.5% 视为稳定币异常
    recovery-observations: 2          # 风险解除后，连续 2 轮正常观察才恢复新增
    recovery-half-budget-observations: 2  # 恢复后再 2 轮只用一半额度
    underwater-loss-pct: 5            # 浮亏超过成本 5% 的持仓，在亏损冻结里按一次亏损计

# 信号跟踪与退出策略研究（docs/信号跟踪与退出策略设计.md），只观察，不影响交易
trendpilot.tracking:
  enabled: true
  dedupe-hours: 24
  main-window-hours: 72
  ext-window-hours: 168
  big-thresholds-pct: [5, 10, 20, 30]
  big-default-pct: 10
  swing-drawdowns-pct: [5, 10, 15, 20]
  swing-main-pct: 10
  swing-min-gain-pct: 3
  pullback-min-pct: 5
  max-gap-run: 2
  max-gap-ratio: 0.05
  show-min-samples: 30
  show-min-symbols: 10
  show-min-days: 7
  decide-min-samples: 100
  decide-min-symbols: 20
  decide-min-weeks: 4
  parallel-rules: []      # 候选退出规则影子并行，例如 [S1_L15, T1_T48_G0]；离线分析选出后再加

trendpilot.binance:
  enabled: true
  base-url: https://api.binance.com
  max-concurrency: 4

# Bybit 独立池：只覆盖 Binance 没有的标的，用 Bybit 自己的 BTC 基准
trendpilot.bybit:
  enabled: true
  base-url: https://api.bybit.com
  max-concurrency: 4

# WebSocket：K 线缓存采集 + FastWatch 最优价（REST 负责初始化和补缺）
trendpilot.stream:
  enabled: true
  binance-url: wss://stream.binance.com:9443/stream
  bybit-url: wss://stream.bybit.com/v5/public/spot

# 研究资料（CoinGecko、DefiLlama 公开接口；可在 config/application-local.yml 填 coingecko-api-key）
trendpilot.research:
  enabled: true
  coingecko-base-url: https://api.coingecko.com/api/v3
  coingecko-api-key: ${COINGECKO_API_KEY:}
  defillama-base-url: https://api.llama.fi
  defillama-datasets-url: https://defillama-datasets.llama.fi   # 代币解锁数据集，免费，每天一次
  rotation: 25
  top-early: 10
  top-movers: 10
  min-interval-ms: 12000         # 无 key 免费档：每 12 秒最多一次（约每分钟 5 次）
  demo-min-interval-ms: 2500     # 配了免费 Demo key 时
  max-backoff-ms: 600000         # 429 指数退避上限 10 分钟
  low-float-ratio: 0.3           # 流通量 / 总量低于 30% 标记 LOW_FLOAT
  # 按 CoinGecko 分类排除：稳定币、代币化股票、代币化黄金
  excluded-categories: [stablecoins, tokenized-stock, tokenized-gold]

# BTC 每日短线（影子，独立账本）：只做多现货、不止损、分 3 档加仓、均价止盈。见 docs/BTC每日短线评估.md
# 改参数时同时改 version（会自动重新回测一次）
trendpilot.btc-daily:
  enabled: true
  version: btc-v2.1-2026-10-15   # 只加了卖出方式回测对比，实盘规则未变
  symbol: BTCUSDT
  cap-usdt: 10000
  cap-until: "2026-11-14"         # 第一个月上限，到期按数据复评
  tranches: [3000, 3000, 4000]   # 各档金额（含手续费），合计 ≤ cap-usdt
  k-strong: 0.25                 # 昨收 > EMA20：第 1 档 = 开盘 − 0.25 × ATR
  k-weak: 0.6                    # 昨收 ≤ EMA20：第 1 档 = 开盘 − 0.6 × ATR
  step-atr: 0.5                  # 档距 0.5 × ATR
  tp-atr-mult: 0.5               # 止盈 = 均价 × (1 + max(0.5 × ATR%, 0.8%))
  tp-min-pct: 0.8
  carry-tp-pct: 0.3              # 跨天未卖：均价 +0.3% 即卖（扣费后仍小赚），不割肉
  fee-rate: 0.001
  slippage-bps: 2
  atr-days: 14
  ema-days: 20
  backtest-days: 365
  # 卖出方式：FIXED（现行）/ TRAIL（移动止盈）/ STOP（宽止损）；上线回测会三种都跑一遍对比
  exit:
    mode: FIXED
    trail-arm-pct: 0.8             # TRAIL：跨天仓位涨到均价 +0.8% 启动跟踪（当日仓位用当日止盈线）
    trail-atr: 0.5                 # TRAIL：从最高价回落 0.5 × ATR 全卖
    trail-floor-pct: 0.3           # TRAIL：卖出价不低于均价 +0.3%
    hard-stop-pct: 8               # STOP：跌到均价 −8% 全部止损
  # 市场与宏观过滤：只影响当天是否开新一轮、开多大；已有仓位照常止盈，不止损
  filters:
    enabled: true
    ema-long: 50                 # 下跌趋势：昨收 < EMA20 < EMA50 且 EMA20 比 5 天前低 → 不开新一轮
    slope-days: 5
    funding-max-pct: 0.03        # 昨天平均资金费率 ≥ 0.03%/8h → 减半
    fear-greed-max: 80           # 恐惧贪婪 ≥ 80 → 减半
    etf-outflow-day-m: 300       # ETF 单日净流出 ≥ 3 亿美元 → 减半
    etf-outflow3d-m: 1000        # ETF 3 日合计净流出 ≥ 10 亿美元 → 不开新一轮
    us10y-rise-pp: 0.2           # 10 年期利率 5 日升 ≥ 0.2 个百分点 → 减半（需 FRED key）
    dollar-rise-pct: 1.5         # 美元指数 5 日涨 ≥ 1.5% → 减半（需 FRED key）
    min-multiplier: 0.25
    # 美联储议息决议日（官方日程；2027 年日程公布后补上）。CPI 发布日由 FRED 获取
    fomc-dates: ["2024-01-31", "2024-03-20", "2024-05-01", "2024-06-12", "2024-07-31", "2024-09-18", "2024-11-07", "2024-12-18",
                 "2025-01-29", "2025-03-19", "2025-05-07", "2025-06-18", "2025-07-30", "2025-09-17", "2025-10-29", "2025-12-10",
                 "2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]
    fred-api-key: ${FRED_API_KEY:}   # 免费 key，填在本机 config/application-local.yml 的 trendpilot.btc-daily.filters.fred-api-key
    binance-futures-url: https://fapi.binance.com
    fear-greed-url: https://api.alternative.me
    farside-url: https://farside.co.uk/btc/
    fred-url: https://api.stlouisfed.org
