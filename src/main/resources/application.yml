spring:
  application:
    name: trendpilot
  config:
    # 本机私密配置（Telegram Token 等），不进代码仓库
    import: optional:file:${trendpilot.local-config:./config/application-local.yml}
  datasource:
    url: jdbc:sqlite:${trendpilot.data-dir:./data}/trendpilot.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite 单写者
      connection-timeout: 120000   # 多个定时任务排队用同一个连接
  flyway:
    enabled: true
    out-of-order: true   # 多个线程并行开发时迁移编号可能不按合并顺序到达
  task:
    scheduling:
      shutdown:
        await-termination: true          # 停机时等正在跑的 Discovery / Monitor 结束
        await-termination-period: 90s
  lifecycle:
    timeout-per-shutdown-phase: 90s
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080
  address: 127.0.0.1   # 只在本机可访问
  shutdown: graceful   # 自动更新停机时等正在处理的请求结束

trendpilot:
  variants:
    depth-min-usdt: 15000   # 深度门槛对照账本 V2D15 用的放宽深度（只做影子对比，不影响 V2）
    strong-trade-usdt: 2000 # V5 每笔金额（U），只作用于 V5；V2 / V2D15 / V1 仍用 capital.trade-size（用户 2026-10-23 要求）
    strong-min-rel1h: 5.855 # 强信号对照账本 V5：新开仓要求 1h 相对 BTC 收益至少这么多（%），只做影子对比，不影响 V2（2026-10-23 起，11-07 中期查看，满 30 天约 11-22 评估）
    # 配置化影子变体（docs/规则说明.md "自动优化"）：每个 = V2 基准 + 参数改动，独立记账、不占 V2 资金、不发开仓 Telegram。
    # base 只能是 V2；最多 3 个同时开新仓；名字改了参数会让同期对比重新计时。V5 继续用原来的 v5_position，数据不动。
    list:
      # 2026-11-09 发布前检查加入"执行敏感度"（上影线 75%）：V5 买法 75% 下全期 +1,738 U、每笔 +0.22 ±3.25 U（区间含 0），
      #      由 PASS 降为 PROMISING，backtest-passed 改为 false（不会自动转正；交易规则不变）。见 docs/策略对比记录/2026-11-08-回测与实盘对账.md
      - { name: V5, base: V2, trade-usdt: "${trendpilot.variants.strong-trade-usdt}", overrides: { min-buy-rel1h: "${trendpilot.variants.strong-min-rel1h}" },
          backtest-passed: false, evidence: "docs/策略对比记录/2026-10-23-V2买入端.md" }
      # 2026-10-26 回测里风险调整收益最好、净值回撤 ≤ 25% 的两组（docs/策略对比记录/2026-10-26-H1H2H4.md）：作为影子对照跑满 30 天；
      # 回测检查差"暴跌行情"一项没全部通过，所以 backtest-passed: false，不会自动转正（用户可以改成 true）
      # V6 = 涨幅榜动量：每小时取成交额前 150 里 24h 涨幅前 3 名，盘口深度和滑点过审核门槛就买；退出同 V2。
      #      4 年回测 +73,240 U / 回撤 4,101 U（现行 +19,343 / 14,538），验证期 +29,728 U，每笔 +3.55 ±1.41 U；只差"暴跌"行情一项
      - { name: V6, base: V2, trade-usdt: 1000, overrides: { momentum-top: 3, momentum-hours: 24, max-open: 17 }, backtest-passed: false,
          evidence: "https://github.com/leo14881-eng/TrendPilot/blob/backtest-results/results/20261025-1844-56f528c/report.md" }
      # V7 = V5 的强信号买入（rel1h ≥ 5.855）+ H2 提前离场（持有 12h 最大浮盈 < 1% 且亏 > 4% 卖），每笔 1,000U：
      #      4 年回测 +48,871 U / 回撤 2,951 U，净值回撤 7.5%，卡玛 4.7（本次所有候选里最高）；比 V5 收益少 9%、回撤少 41%
      #      2026-11-05 用户同意停用（表现最差，名额让给 V6BS6）：停开新仓，现有持仓按原规则卖完后自动归档，记账和历史保留，不占活跃名额
      - { name: V7, base: V2, trade-usdt: 1000, overrides: { min-buy-rel1h: 5.855, early-exit-hours: 12, early-exit-max-mfe-pct: 1, early-exit-loss-pct: 4 },
          backtest-passed: false, evidence: "https://github.com/leo14881-eng/TrendPilot/blob/backtest-results/results/20261025-1817-382bf63/report.md",
          retired: true, retired-note: "2026-11-05 用户同意停用：安全第一，名额让给 V6BS6" }
      # V6B = V6 同规则（成交额前 150 里 24h 涨幅前 3、最多 17 个、每笔 1,000U、退出同 V2），但标的池和盘口用 Bybit
      #       （用户只有 Bybit 账号，2026-11-02 授权上线影子，不要求回测通过）。backtest-passed: false，不会自动转正；
      #       Bybit 数据回测见 evidence
      - { name: V6B, base: V2, trade-usdt: 1000, overrides: { momentum-top: 3, momentum-hours: 24, max-open: 17, momentum-venue: BYBIT },
          backtest-passed: false, evidence: "docs/策略对比记录/2026-11-02-V6-Bybit.md" }
      # V6BS6 = V6B 同买入（Bybit 池、24h 涨幅前 3、最多 17 个、每笔 1,000U），卖出改为 O3 的"固定止损 6%"
      #       （1h 收盘确认，替代 ATR 止损；利润保护、3 天等反弹照旧）。用户 2026-11-05 同意上线影子，和 V6B 并排跑 30 天；
      #       安全第一，降低单笔亏损。Bybit 数据回测见 evidence
      - { name: V6BS6, base: V2, trade-usdt: 1000, overrides: { momentum-top: 3, momentum-hours: 24, max-open: 17, momentum-venue: BYBIT, stop-fixed-pct: 6 },
          backtest-passed: false, evidence: "docs/策略对比记录/2026-11-05-V6BS6-Bybit止损6.md" }
  # 自动优化：变体满 30 天按同期表现自动转正 / 停开新仓，每周读取回测候选（见 com.trendpilot.variant.AutoPromoter）
  optimize:
    auto-promote: true              # 已批准自动转正：只对影子账本 V2 生效（用户 2026-10-26 授权）
    real-money-auto-promote: false  # 以后有真钱账本时，自动改真钱规则必须用户明确同意后才能打开
    min-days: 30                    # 一个变体完整测试一个月再评估转正 / 淘汰（用户 2026-10-26）
    early-stop-days: 14             # 满 14 天回撤已超过 V2 × 1.5 的提前停开新仓
    early-stop-dd-ratio: 1.5
    min-closed: 20
    promote-dd-ratio: 1.1
    retire-dd-ratio: 1.3
    max-active: 4                   # 用户 2026-11-02 授权由 3 个增加到 4 个（"你决定就行"），新增 V6B；2026-11-05 V7 停用、V6BS6 补上
    formal-change-days: 14          # 正式规则最多每 2 周换一次
    last-formal-change: "2026-10-23"  # V2 上次正式改动（恢复基准）
    candidates-url: https://raw.githubusercontent.com/leo14881-eng/TrendPilot/backtest-results/candidates/candidates.json
    # 评估口径（2026-11-09 收紧，不改交易规则）：转正 / 30 天评估只从变体接入 FastWatch 起算（2026-11-02 版本 43b7196 部署后启动），
    # 之前的数据日报单列、不计入转正
    fastwatch-since: "2026-11-02T02:32:17Z"
    # 影子对账（转正前用同时段重跑的回测和实盘对比，研究入口 ReconStudy）：研究流程确认后才把 execution-reconciled 改成 true；
    # execution-gap-per-k = 执行分项（实盘 − 同时段回测，U/每千U 每笔），< −2 时不转正、先查执行。没写的变体 = 没确认
    reconciled:
      "[V5]": { execution-reconciled: false }
      "[V6]": { execution-reconciled: false }
      "[V6B]": { execution-reconciled: false }
      "[V6BS6]": { execution-reconciled: false }
  zone: Asia/Ho_Chi_Minh
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  file:
    name: ./logs/trendpilot.log
  logback:
    rollingpolicy:
      max-history: 30

# 策略参数（人工修改后请同时修改 version）
trendpilot.strategy:
  version: v3.4b-2026-10-23-baseline
  fee-rate: 0.001                 # 单边手续费 0.1%
  universe:
    quote-asset: USDT
    # 稳定币、法币、黄金代币等
    excluded-base-assets: [USDC, FDUSD, TUSD, USDP, DAI, BUSD, USDE, USD1, PYUSD, RLUSD, XUSD, BFUSD, AEUR, FRAX, USDS, EUR, EURI, GBP, TRY, BRL, ARS, JPY, MXN, PLN, RON, UAH, ZAR, PAXG, XAUT]
    # 官方代币化股票（Bybit xStocks、Binance 上的 GMEB/LLYB 等）；交易所标记为股票类、或 CoinGecko 分类为股票的也会排除
    tokenized-stock-base-assets: [GMEB, LLYB, AAPLX, AMZNX, COINX, CRCLX, GOOGLX, HOODX, METAX, MSFTX, MSTRX, NVDAX, QQQX, SPYX, TSLAX]
    blocklist: []                 # 人工确认身份有问题的标的
    max-missing-ratio: 0.05       # 缺数据超过 5% 视为扫描不完整，不做新买入
  early:
    min-hits: 2
    rel1h: 0.8
    rel4h: 1.5
    accel: 0.5
    volume-accel: 1.35
    compression: 1.2
    momentum-rel1h: 0.25
  review:
    min-score: 8
    min-rel1h: 0.8
    min-rel4h: 1.5
    max-signal-age-minutes: 30    # 信号取最近整点小时收盘，Discovery 在 :17 跑，正常 17 分钟
    max-spread-bps: 50
    depth-band-pct: 2
    min-depth-usdt: 30000
    max-slippage-bps: 75
    min-rr: 1.5
    chase-threshold-pct: 12       # 高于首次 EARLY 价 12% 以上
    chase-min-rr: 2
    hot24h-pct: 20                # 24 小时涨超 20%
    hot-rel1h-multiplier: 2       # 此时 1h 相对收益要求翻倍，且加速度必须为正
    risk-drop-pct: 2.5            # RR 风险情景假设跌幅（不是止损线）
    upside-atr-multiple: 4
    min-upside-pct: 2
    max-upside-pct: 15
    reentry-cooldown-minutes: 60
    reentry-min-early-observations: 2   # 卖出后至少 2 个独立 generation 重新出现 EARLY，才允许再买
    min-buy-rel1h: 0              # 新开仓要求 1h 相对 BTC 收益至少这么多（%）；0 = 不用。V2 保持原买入规则作为基准；强信号门槛 5.855 改为独立影子账本 V5 对比（trendpilot.variants.strong-min-rel1h），见 docs/策略对比记录/2026-10-23-V2买入端.md
  capital:
    hard-cap: 20000
    normal-pool: 17000
    strategic-reserve: 3000
    trade-size: 1000
    max-tranches-per-coin: 3
    regime-limits:
      - { regime: RISK_OFF, pct: 0.60 }
      - { regime: NEUTRAL, pct: 0.75 }
      - { regime: CONSTRUCTIVE, pct: 0.85 }
      - { regime: STRONG, pct: 0.95 }
  add:
    min-drop-pct: 1.5
    atr-multiple: 1.0
    third-tranche-multiplier: 1.5
    min-signal-gap-minutes: 15
  exit:
    protect-arm-pct: 2            # 原始收益 ≥2% 且净利 >0 启动利润保护
    protect-min-floor-pct: 0.35   # 底线至少为本金 0.35%
    protect-giveback-pct: 1       # 或 最高净利 − 本金 1%（2026-10-14 由 2 收紧）
    protect-lock-ratio: 0.6       # 或 最高净利的 60%（2026-10-14 新增）：三者取高
    review-target-pct: 8          # 原始收益 8% 时复核
    decay-min-weak: 2             # 至少两项弱条件
    decay-consecutive: 3          # 连续三个有效观察
    hard-max-spread-bps: 300      # 严重流动性异常
    hard-max-slippage-bps: 300
    hard-min-bid-depth-usdt: 5000
  risk:
    btc-shock1h-pct: -3           # BTC 1h 跌超 3% 视为市场冲击，本轮不新增风险
    risk-off-btc24h-pct: -5
    risk-off-btc4h-pct: -2.5
    risk-off-breadth: 0.25
    constructive-breadth: 0.5
    strong-breadth: 0.65
    strong-btc24h-pct: 3
    loss-exits-freeze: 3          # 窗口内亏损退出 ≥3 次：冻结新增
    loss-exits-half-budget: 2     # =2 次：额度减半
    loss-window-hours: 24
    liquidity-stress-spread-bps: 25   # 成交额前 50 的标的中位价差超过 25 bps 视为流动性紧张
    stable-depeg-pct: 0.5             # USDC 等稳定币偏离 1 美元超过 0.5% 视为稳定币异常
    recovery-observations: 2          # 风险解除后，连续 2 轮正常观察才恢复新增
    recovery-half-budget-observations: 2  # 恢复后再 2 轮只用一半额度
    underwater-loss-pct: 5            # 浮亏超过成本 5% 的持仓，在亏损冻结里按一次亏损计
    alt-crash-median1h-pct: -5        # 山寨崩盘熔断：任一交易池 1h 涨跌中位数 ≤ -5% 时停止新买入/加仓
    alt-crash-recover-pct: -2         # 中位数回到 -2% 以上解除（之后仍按恢复期规则逐步恢复）
    alt-crash-max-hours: 24           # 最长熔断 24 小时

# 信号跟踪与退出策略研究（docs/信号跟踪与退出策略设计.md），只观察，不影响交易
trendpilot.tracking:
  enabled: true
  dedupe-hours: 24
  main-window-hours: 72
  ext-window-hours: 168
  big-thresholds-pct: [5, 10, 20, 30]
  big-default-pct: 10
  swing-drawdowns-pct: [5, 10, 15, 20]
  swing-main-pct: 10
  swing-min-gain-pct: 3
  pullback-min-pct: 5
  max-gap-run: 2
  max-gap-ratio: 0.05
  show-min-samples: 30
  show-min-symbols: 10
  show-min-days: 7
  decide-min-samples: 100
  decide-min-symbols: 20
  decide-min-weeks: 4
  parallel-rules: [S1_L8, S1_L12, S2_k6, T1_T24_g0, T2_T24_L210, M1_D3, X1_ATR1.5_W72]   # 候选退出规则影子并行：只记录对比，不影响正式买卖；X1 = 日线 ATR×1.5 止损 + 3 天等反弹（2026-10-17 用户批准）

trendpilot.binance:
  enabled: true
  base-url: https://api.binance.com
  max-concurrency: 4

# Bybit 独立池：只覆盖 Binance 没有的标的，用 Bybit 自己的 BTC 基准
trendpilot.bybit:
  enabled: true
  base-url: https://api.bybit.com
  max-concurrency: 4

# WebSocket：K 线缓存采集 + FastWatch 最优价（REST 负责初始化和补缺）
trendpilot.stream:
  enabled: true
  binance-url: wss://stream.binance.com:9443/stream
  bybit-url: wss://stream.bybit.com/v5/public/spot
  debug-log: false   # 改成 true（可写在 config/application-local.yml）并重启：原始消息写到 logs/ws-raw.log

# 研究资料（CoinGecko、DefiLlama 公开接口；可在 config/application-local.yml 填 coingecko-api-key）
trendpilot.research:
  enabled: true
  coingecko-base-url: https://api.coingecko.com/api/v3
  coingecko-api-key: ${COINGECKO_API_KEY:}
  defillama-base-url: https://api.llama.fi
  defillama-datasets-url: https://defillama-datasets.llama.fi   # 代币解锁数据集，免费，每天一次
  rotation: 25
  top-early: 10
  top-movers: 10
  min-interval-ms: 12000         # 无 key 免费档：每 12 秒最多一次（约每分钟 5 次）
  demo-min-interval-ms: 2500     # 配了免费 Demo key 时
  max-backoff-ms: 600000         # 429 指数退避上限 10 分钟
  low-float-ratio: 0.3           # 流通量 / 总量低于 30% 标记 LOW_FLOAT
  # 按 CoinGecko 分类排除：稳定币、代币化股票、代币化黄金
  excluded-categories: [stablecoins, tokenized-stock, tokenized-gold]

# 山寨季仪表盘（只读信息，不交易）：最强板块用的 CoinGecko 板块（每天每个 1 次请求，存 coin_sector，不参与标的排除）
trendpilot.altseason:
  sector-categories: layer-1,layer-2,meme-token,artificial-intelligence,decentralized-finance-defi,gaming,real-world-assets-rwa,depin,privacy-coins,exchange-based-tokens
  stablecoins-url: https://stablecoins.llama.fi   # DefiLlama 免费稳定币接口，每天最多 2 次

# BTC 每日短线（影子，独立账本）：只做多现货、不止损、分 3 档加仓、均价止盈。见 docs/BTC每日短线评估.md
# 改参数时同时改 version（会自动重新回测一次）
trendpilot.btc-daily:
  enabled: true
  version: btc-v4-2026-10-20   # 用户 2026-10-20 选定：第 1 档 0.25/0.40×ATR + 方案 B 卖法 + 30 天降到成本 +3%（见 docs/策略变更记录.md）；回滚：version 改回 btc-v3.2-2026-10-15-v2、k-weak 0.6、exit.mode FIXED、require-backtest true
  symbol: BTCUSDT
  cap-usdt: 10000
  cap-until: "2026-11-14"         # 第一个月上限，到期按数据复评
  tranches: [3000, 3000, 4000]   # 各档金额（含手续费），合计 ≤ cap-usdt
  first-open-pct: 0              # >0 时第 1 档 = 开盘 × (1 − first-open-pct%)，强弱日一样；0 = 用下面两行的 k × ATR（现行）
  k-strong: 0.25                 # 昨收 > EMA20：第 1 档 = 开盘 − 0.25 × ATR
  k-weak: 0.4                    # 昨收 ≤ EMA20：第 1 档 = 开盘 − 0.4 × ATR（2026-10-20 用户选定，原 0.6）
  step-atr: 0.5                  # 档距 0.5 × ATR
  tp-atr-mult: 0.5               # 止盈 = 均价 × (1 + max(0.5 × ATR%, 0.8%))
  tp-min-pct: 0.8
  carry-tp-pct: 0.3              # 跨天未卖：止盈价降为均价 +0.3%（FIXED / TRAIL 用；方案 B 不再跨天就降，改为满 30 天才降）
  fee-rate: 0.001
  slippage-bps: 2
  atr-days: 14
  ema-days: 20
  backtest-days: 365
  # 策略：V2（旧）/ V3（新）/ AUTO（上线回测 V3 不比 V2 差才用 V3，否则仍 V2 并提醒）。回滚：改为 V2 并改 version
  strategy: V2
  v3:
    partial-at-pct: 1.5            # 涨到均价 +1.5% 先卖 1/3
    partial-pct: 33.33
    trail-hour-atr: 1.5            # 剩下的从最高价回落 1.5 × 1h ATR 再卖
    floor-pct: 0.3                 # 只在均价 +0.3% 以上卖（覆盖手续费），不卖亏
    hour-ema-bars: 20              # 上升行情支撑：1h EMA20、前一日 VWAP、前一日低点
    hour-atr-bars: 14
    side-atr: 1.5                  # 震荡：第 1 档 = 开盘 − 1.5 × ATR，之后每档再低 step-atr × ATR
    side-multiplier: 0.5           # 震荡金额减半
    min-gap-atr: 0.3               # 上升行情相邻两档至少差 0.3 × ATR
    first-fallback-atr: 0.25       # 支撑都不在开盘下方时，第 1 档 = 开盘 − 0.25 × ATR
    guard: NONE                    # 被套保护：NONE 不止损（用户规则）；TREND / TIME / STOP 只在回测里对比，改需用户同意
    guard-days: 10
    guard-stop-pct: 8
  # V2 的卖出方式：FIXED（到止盈价就卖）/ TRAIL（到止盈价后跟踪最高价）/ PARTIAL（先卖一半、剩下跟踪）/ STOP（宽止损）
  # AUTO：上线回测从 candidates 里选不比 FIXED 差且总盈亏最高的一种。用户 2026-10-15 要求加大止盈空间
  # 回滚：mode 改回 FIXED（或指定 TRAIL / PARTIAL）并改 version
  exit:
    mode: TRAIL_B                  # 方案 B（用户 2026-10-20 选定）：涨到均价 +3% 后跟踪，从最高价回落 3×ATR 卖；满 30 天含费成本 +3% 以上卖；绝不卖亏
    activate-pct: 3                # 跟踪启动：均价 +3%
    give-atr: 3                    # 从最高价回落 3 × 日线 ATR14 卖出
    timeout-days: 30               # 持有满 30 天未卖：到 timeout-target-pct 的目标就卖
    floor-pct: 0.3                 # 任何卖出的最低价（扣滑点后）= 含费均价 × (1 + 手续费 + 0.3%)
    timeout-target-pct: 3          # 持有满 30 天后的卖出目标：含费均价 × (1 + 手续费 + 3%)（用户 2026-10-20 选定）；timeout-days 设为 -1 则不降目标
    candidates: [TRAIL, PARTIAL]
    require-backtest: false        # 用户选定直接生效（回测照常跑、只作对照）；改回 FIXED 时恢复 true
    trail-atr: 0.5                 # TRAIL：从最高价回落 0.5 × ATR 全卖，最低按原止盈价
    partial-pct: 50                # PARTIAL：到止盈价先卖 50%
    partial-trail-atr: 1.0         # PARTIAL：剩下的从最高价回落 1 × ATR 再卖，最低按原止盈价，可跨天
    hard-stop-pct: 8               # STOP：跌到均价 −8% 全部止损
  # 市场与宏观过滤：只影响当天是否开新一轮、开多大；已有仓位照常止盈，不止损
  filters:
    enabled: true
    ema-long: 50                 # 下跌趋势：昨收 < EMA20 < EMA50 且 EMA20 比 5 天前低 → 不开新一轮
    slope-days: 5
    funding-max-pct: 0.03        # 昨天平均资金费率 ≥ 0.03%/8h → 减半
    fear-greed-max: 80           # 恐惧贪婪 ≥ 80 → 减半
    etf-outflow-day-m: 300       # ETF 单日净流出 ≥ 3 亿美元 → 减半
    etf-outflow3d-m: 1000        # ETF 3 日合计净流出 ≥ 10 亿美元 → 不开新一轮
    us10y-rise-pp: 0.2           # 10 年期利率 5 日升 ≥ 0.2 个百分点 → 减半（需 FRED key）
    dollar-rise-pct: 1.5         # 美元指数 5 日涨 ≥ 1.5% → 减半（需 FRED key）
    min-multiplier: 0.25
    # 美联储议息决议日（官方日程；2027 年日程公布后补上）。CPI 发布日由 FRED 获取，没有 FRED key 时用下面的 BLS 官方日程
    fomc-dates: ["2024-01-31", "2024-03-20", "2024-05-01", "2024-06-12", "2024-07-31", "2024-09-18", "2024-11-07", "2024-12-18",
                 "2025-01-29", "2025-03-19", "2025-05-07", "2025-06-18", "2025-07-30", "2025-09-17", "2025-10-29", "2025-12-10",
                 "2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]
    # CPI 发布日（BLS 官方日程 bls.gov/schedule/2026；2027 年日程公布后补上）。某年没有日程且没有 FRED key 时按数据缺失处理（金额减半）
    cpi-dates: ["2026-01-13", "2026-02-13", "2026-03-11", "2026-04-10", "2026-05-12", "2026-06-10",
                "2026-07-14", "2026-08-12", "2026-09-11", "2026-10-14", "2026-11-10", "2026-12-10"]
    fred-api-key: ${FRED_API_KEY:}   # 免费 key，填在本机 config/application-local.yml 的 trendpilot.btc-daily.filters.fred-api-key
    binance-futures-url: https://fapi.binance.com
    fear-greed-url: https://api.alternative.me
    farside-url: https://farside.co.uk/btc/
    fred-url: https://api.stlouisfed.org

