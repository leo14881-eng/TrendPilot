# One-off reachability probe for Bybit public market data from GitHub Actions (research only).
name: Bybit probe
on:
  push:
    branches: [research/bybit-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in BTCUSDT ETHUSDT SOLUSDT PEPEUSDT ARBUSDT; do
            l=$(curl -sS -m 30 "https://public.bybit.com/spot/$s/" | grep -o 'href="[^"]*"' | sed 's/href="//;s/"//')
            echo "== $s files=$(echo "$l" | wc -l) first=$(echo "$l" | head -1) last=$(echo "$l" | tail -1)"
            for f in $(echo "$l" | head -1) $(echo "$l" | tail -1); do
              echo "$f $(curl -sSI -m 20 "https://public.bybit.com/spot/$s/$f" | grep -i content-length)"
            done
          done
          echo "symbols=$(curl -sS -m 30 https://public.bybit.com/spot/ | grep -c 'USDT/')"
          f=$(curl -sS "https://public.bybit.com/spot/SOLUSDT/" | grep -o 'href="[^"]*"' | sed 's/href="//;s/"//' | tail -1)
          curl -sS "https://public.bybit.com/spot/SOLUSDT/$f" | zcat | head -3
